[project]
name = "hammertime-detector"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["hammertime-core", "hammertime-bus", "fastapi>=0.115"]

[project.scripts]
hammertime-detector = "hammertime.detector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hammertime"]

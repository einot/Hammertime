[project]
name = "hammertime-trie"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["hammertime-core", "hammertime-bus", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
hammertime-trie = "hammertime.trie.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hammertime"]

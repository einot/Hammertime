[project]
name = "hammertime-aggregator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["hammertime-core", "hammertime-bus", "hammertime-store"]

[project.scripts]
hammertime-aggregator = "hammertime.aggregator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hammertime"]

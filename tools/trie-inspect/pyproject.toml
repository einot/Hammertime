[project]
name = "hammertime-trie-inspect"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["hammertime-core", "hammertime-trie"]

[project.scripts]
hammertime-trie-inspect = "hammertime.tools.trie_inspect.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hammertime"]

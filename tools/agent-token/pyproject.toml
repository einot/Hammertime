[project]
name = "hammertime-agent-token"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["hammertime-core"]

[project.scripts]
hammertime-agent-token = "hammertime.tools.agent_token.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hammertime"]

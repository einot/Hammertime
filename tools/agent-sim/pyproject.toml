[project]
name = "hammertime-agent-sim"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["hammertime-core", "httpx>=0.27"]

[project.scripts]
hammertime-agent-sim = "hammertime.tools.agent_sim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hammertime"]

[project]
name = "hammertime-core"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "prometheus-client>=0.20", "structlog>=24.1"]

[project.scripts]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hammertime"]

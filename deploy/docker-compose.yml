name: hammertime

# Reference stack (ADR-0013 decision 11). Start order is enforced by
# depends_on conditions: nats healthy -> provision completed -> services;
# `make up` passes --wait so a crash-looping service fails the command
# instead of leaving a dead container behind (ADR-0009 decision 10).
services:
  # Reference event log (ADR-0012 decision 9, ADR-0013): NATS JetStream,
  # single server, file storage under a named volume. Docker Official Image;
  # linux/amd64 digest of the 2.15.0-alpine tag on 2026-09-21:
  # sha256:eda962d67930eda338222072d9a9f3818855d922ad224c399b0b01d251e9b91b.
  # The -alpine variant carries the shell and wget the healthcheck needs;
  # the scratch-based nats:2.15.0 does not (ADR-0013 assumption 11).
  nats:
    image: nats:2.15.0-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: ["nats-data:/data"]
    # Loopback only, no auth (ADR-0013 assumption 13): anything reaching 4222 or
    # 8222 is trusted; a non-local deployment MUST add NATS `authorization`.
    ports: ["127.0.0.1:4222:4222", "127.0.0.1:8222:8222"]
    healthcheck:
      # 200 only once JetStream is enabled and serving (js-enabled-only).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      retries: 15

  # Reference store (ADR-0012 decision 10): Valkey. noeviction is required by
  # ADR-0011 for the hammertime:agg:* and hammertime:dedup:* keyspaces.
  valkey:
    image: valkey/valkey:9.1.2-alpine
    command: ["valkey-server", "--maxmemory-policy", "noeviction"]
    # Loopback only, no auth (ADR-0013 assumption 13): anything reaching 6379 is
    # trusted; a non-local deployment MUST add Valkey `requirepass`.
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      retries: 15

  # One-shot stream provisioning (ADR-0013 decision 2): JetStream does not
  # create streams on publish, so every registered topic's stream is created
  # or reconciled here before any service starts. Idempotent; exit 0 when
  # every stream matches, 1 when nats stays unreachable or a stream conflicts
  # on an immutable field, 2 on invalid arguments. Reads only
  # HAMMERTIME_LOG_LEVEL from the env file; the servers are a CLI flag.
  provision:
    build: { context: .., dockerfile: tools/provision/Dockerfile }
    env_file: ../.env.example
    command: ["--servers", "nats://nats:4222"]
    restart: "no"
    depends_on:
      nats: { condition: service_healthy }

  # Application services. Each probes its own GET /readyz (ADR-0009 decision
  # 10) with the stdlib, since python:3.12-slim ships neither curl nor wget;
  # urlopen raises on the 503 a not-yet-ready service answers. 30 x 2 s is the
  # 60 s HAMMERTIME_STARTUP_TIMEOUT_S a service may spend retrying a
  # dependency before it gives up.
  ingest:
    build: { context: .., dockerfile: services/ingest/Dockerfile }
    env_file: ../.env.example
    environment:
      HAMMERTIME_BUS_BROKERS: nats://nats:4222
      HAMMERTIME_REDIS_URL: redis://valkey:6379/0
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 2s
      retries: 30
    depends_on:
      provision: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }

  # Single member owning every shard (ADR-0013 decision 6). Each shard is
  # taken under a lease (decision 7, as amended by Amendment 6) keyed by
  # HAMMERTIME_AGGREGATOR_MEMBER_ID plus a token this process generates for
  # itself, so no second owner can hold a shard.
  # The member id is pinned rather than left to default to the hostname
  # (under compose the container ID, which a recreated container loses): a
  # recreated container is then a *same-member* holder, which waits in
  # process for its predecessor's leases to lapse -- at most
  # HAMMERTIME_AGGREGATOR_LEASE_TTL_S -- instead of being another member,
  # which is refused and exits 1.
  # container_name makes Compose refuse `--scale` on this service, which
  # would otherwise start a second process under the same member id and the
  # same shard set: a scaled deployment is separate services with disjoint
  # HAMMERTIME_SHARD_IDS whose union is 0-127, not replicas.
  aggregator:
    build: { context: .., dockerfile: services/aggregator/Dockerfile }
    container_name: hammertime-aggregator-0
    env_file: ../.env.example
    environment:
      HAMMERTIME_BUS_BROKERS: nats://nats:4222
      HAMMERTIME_REDIS_URL: redis://valkey:6379/0
      HAMMERTIME_SHARD_IDS: all
      HAMMERTIME_AGGREGATOR_MEMBER_ID: aggregator-0
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/readyz', timeout=2)"]
      interval: 2s
      retries: 30
    depends_on:
      provision: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }

  trie:
    build: { context: .., dockerfile: services/trie/Dockerfile }
    env_file: ../.env.example
    environment:
      HAMMERTIME_BUS_BROKERS: nats://nats:4222
    ports: ["8081:8081"]
    volumes: ["trie-snapshots:/snapshots"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz', timeout=2)"]
      interval: 2s
      retries: 30
    depends_on:
      provision: { condition: service_completed_successfully }

  detector:
    build: { context: .., dockerfile: services/detector/Dockerfile }
    env_file: ../.env.example
    environment:
      HAMMERTIME_BUS_BROKERS: nats://nats:4222
    ports: ["8082:8082"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/readyz', timeout=2)"]
      interval: 2s
      retries: 30
    depends_on:
      provision: { condition: service_completed_successfully }

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

volumes:
  nats-data:
  trie-snapshots:
